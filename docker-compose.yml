version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: chess_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"  # Esposto esternamente per accesso da fuori Docker
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chess_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_user -d chess_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chess_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads  # Bind mount - file visibili nel progetto
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - UPLOAD_DIR=/app/uploads
      - FAL_KEY=${FAL_KEY}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chess_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chess_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      # For development the app is served to your host browser; the browser must reach
      # the backend via the host address. Keep localhost so requests go to the host port
      # that is forwarded to the backend container (we expose 8000:8000).
      - VITE_API_URL=${VITE_API_URL}
    command: npm run dev
    depends_on:
      - backend
    networks:
      - chess_network

networks:
  chess_network:
    driver: bridge

volumes:
  postgres_data:  # Volume per dati PostgreSQL
